<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CarClarity</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body class="listing-panel">
    <h1>CarClarity</h1>
    <p id="urlCheck">Loading website...</p>
    <p id="description" role="status"></p>
    <form id="vehicleForm" class="review-card" hidden novalidate>
      <h2>Vehicle details</h2>
      <p id="identitySource"></p>
      <dl id="vehiclePreview" class="vehicle-preview">
        <dt>Year</dt><dd id="previewYear"></dd>
        <dt>Make</dt><dd id="previewMake"></dd>
        <dt>Model</dt><dd id="previewModel"></dd>
      </dl>
      <fieldset id="vehicleFields" aria-label="Year, make, and model" hidden>
        <label for="year">Year</label>
        <input id="year" inputmode="numeric" maxlength="4" required>
        <label for="make">Make</label>
        <input id="make" required>
        <label for="model">Model</label>
        <input id="model" required>
      </fieldset>
      <button id="confirmVehicle" type="submit">Confirm vehicle</button>
      <button id="editVehicle" type="button">Edit vehicle</button>
      <p id="verificationStatus" role="status"></p>
    </form>
    <form id="postForm" class="review-card" hidden novalidate>
      <h2>Seller post</h2>
      <div id="postPreview">
        <p id="previewPostTitle" class="post-title"></p>
        <p id="previewPostDescription" class="post-description"></p>
      </div>
      <fieldset id="postFields" aria-label="Post title and description" hidden>
        <label for="postTitle">Post title</label>
        <input id="postTitle" required>
        <label for="postDescription">Seller description</label>
        <textarea id="postDescription" rows="5"></textarea>
      </fieldset>
      <button id="confirmPost" type="submit">Confirm post</button>
      <button id="editPost" type="button">Edit post</button>
      <p id="postStatus" role="status"></p>
    </form>
    <details id="scrapedDetails" hidden>
      <summary>Craigslist listing details</summary>
      <ul id="details"></ul>
    </details>
    <details id="formatted" hidden>
      <summary>Formatted listing data</summary>
      <pre id="listingJson"></pre>
    </details>
    <script src="content.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
