name = "carclarity-worker"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Gemini models to try, in order. If one is busy, the Worker retries once, then moves to the next.
# All must be Gemini 3 models (they share the thinkingLevel setting). Change this line and redeploy.
GEMINI_MODELS = "gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3-flash-preview"
